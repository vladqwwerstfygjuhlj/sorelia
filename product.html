<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SORELIA — товар</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">

  <link rel="stylesheet" href="css/styles.css"/>
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="nav">
        <a class="brand" href="index.html">
          <div class="brand__name">SORELIA</div>
          <div class="brand__tag">quiet elegance</div>
        </a>

        <nav class="menu">
          <a href="catalog.html">Каталог</a>
          <a href="about.html">Про бренд</a>
        </nav>

        <div class="actions">
          <a class="icon-btn" href="catalog.html">Назад</a>
          <button class="icon-btn" id="cartBtn" type="button">
            Кошик <span class="badge" id="cartCount">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="main container">
    <div class="product-page">
      <div class="gallery">
        <img src="" alt="" id="p-img" style="width: 100%; border-radius: 8px; min-height: 300px; background: #d5eef6;">
      </div>

      <div class="panel">
        <div class="kicker">sorelia jewelry</div>
        <h1 class="p-title" id="p-title">—</h1>
        
        <div class="price" id="p-price" style="margin-top:10px;">—</div>
        
        <div id="size-selection-wrapper" style="margin-top: 25px;">
          <div class="kicker" style="font-size: 11px;">доступні розміри</div>
          <div id="p-sizes" style="display:flex; gap:8px; margin-top:10px; flex-wrap: wrap;">
            </div>
        </div>

        <div style="margin-top:25px;">
          <button class="btn btn--filled" id="add" style="width: 100%;">Додати до кошика</button>
        </div>

        <div class="p-mood" id="p-mood" style="margin-top:20px; color: var(--muted); font-size: 14px; line-height: 1.6;"></div>

        <div id="note" style="margin-top:10px; min-height:18px; font-size: 12px;"></div>
        
        <div class="spec" id="p-specs" style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
          </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      Якщо це для подарунка — ми зробимо тихо і красиво.
    </div>
  </footer>

  <div class="drawer" id="cartDrawer" aria-hidden="true">
    <div class="drawer__backdrop" data-close="1"></div>

    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-label="Кошик">
      <div class="drawer__head">
        <div>
          <div class="kicker">кошик</div>
          <div class="drawer__title">Твої обрані позиції</div>
        </div>
        <button class="drawer__close" type="button" data-close="1" aria-label="Закрити">×</button>
      </div>

      <div class="drawer__body">
        <div id="cartItems"></div>
      </div>

      <div class="drawer__foot">
        <div class="drawer__total">
          <span class="small">Разом</span>
          <span class="price" id="cartTotal">0 грн</span>
        </div>

        <div class="toolbar-right" style="display: flex; gap: 10px; margin-top: 15px;">
          <button class="btn" id="clearCart" type="button">Очистити</button>
          <button class="btn btn--filled" id="checkoutBtn" type="button" style="flex: 1;">Оформити</button>
        </div>

        <div class="small" id="cartNote" style="margin-top: 10px; min-height:18px;"></div>
      </div>
    </aside>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof initProductPage === 'function') {
        initProductPage();
      }
    });
  </script>
</body>
</html>
